[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-pipeline"
version = "0.1.0"
description = "Read-only MIME and attachment extraction and email processing pipeline"
requires-python = ">=3.11"
dependencies = ["IMAPClient>=3.0,<4", "requests>=2.31"]

[project.scripts]
email-pipeline = "email_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
