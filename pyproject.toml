[project]
name = "email-pipeline"
version = "0.1.0"
description = "Read-only MIME and attachment extraction and email processing pipeline"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
email-pipeline = "email_pipeline.__main__:main"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
